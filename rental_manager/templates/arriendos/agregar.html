{% extends 'base.html' %}

{% block title %}Agregar Arriendo - Gestión de Locales{% endblock %}

{% block content %}
<div class="section">
    <h1>Registrar Nuevo Arriendo</h1>
    
    <form method="POST" class="form">
        <div class="form-group">
            <label for="local_id">Local:</label>
            <select id="local_id" name="local_id" required>
                <option value="">-- Seleccione un local --</option>
                {% for local in locales %}
                <option value="{{ local.id }}">{{ local.nombre }} ({{ local.metros_cuadrados }} m²)</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="mes">Mes:</label>
                <select id="mes" name="mes" required>
                    {% for i in range(1, 13) %}
                    <option value="{{ i }}">{{ "%02d"|format(i) }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="anio">Año:</label>
                <input type="number" id="anio" name="anio" min="2020" max="2030" value="2024" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="valor_uf">Valor del Arriendo en UF:</label>
            <input type="number" id="valor_uf" name="valor_uf" step="0.01" required placeholder="Ej: 15.5">
        </div>
        
        <div class="form-group">
            <label for="fecha_gestion">Fecha de Gestión (UF del día):</label>
            <input type="date" id="fecha_gestion" name="fecha_gestion" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Arriendo</button>
            <a href="{{ url_for('listar_arriendos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fechaInput = document.getElementById('fecha_gestion');
        if (!fechaInput.value) {
            fechaInput.valueAsDate = new Date();
        }
        
        const date = new Date();
        document.getElementById('mes').value = date.getMonth() + 1;
    });
</script>
{% endblock %}
