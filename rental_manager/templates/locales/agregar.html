{% extends 'base.html' %}

{% block title %}Agregar Local - Gestión de Locales{% endblock %}

{% block content %}
<div class="section">
    <h1>Agregar Nuevo Local</h1>
    
    <form method="POST" class="form">
        <div class="form-group">
            <label for="nombre">Nombre del Local:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Local 1A">
        </div>
        
        <div class="form-group">
            <label for="metros">Metros Cuadrados:</label>
            <input type="number" id="metros" name="metros" step="0.01" required placeholder="Ej: 45.5">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Local</button>
            <a href="{{ url_for('listar_locales') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
